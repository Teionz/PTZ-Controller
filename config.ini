[camera]
# IP fixo da câmera na rede da igreja
ip = 10.0.0.250

# Endereço do vídeo (RTSP). /1 = stream principal (HD, melhor imagem).
# Se o PC for fraco e travar, troque /1 por /2 (mais leve, qualidade menor).
rtsp_url = rtsp://10.0.0.250:554/1

[controle]
# Como o app comanda o movimento da câmera:
#   visca  -> padrão dessas câmeras (VISCA sobre IP, UDP porta 1259)
#   http   -> alternativa (CGI da PTZOptics), use se com "visca" ela não mexer
protocolo = visca
visca_porta = 1259
http_porta = 80

# Inverter direção caso a câmera vá para o lado errado (troque de false para true)
inverter_pan = false
inverter_tilt = false

[manual]
# Velocidade do controle manual pelo teclado (WASD move, Q/E zoom).
# pan: 1-24   tilt: 1-20   zoom: 1-7
vel_pan = 10
vel_tilt = 8
vel_zoom = 3

[rastreamento]
# Largura de exibição/processamento. 1920 = Full HD.
# Obs.: a TAXA DE QUADROS (30 fps) e a resolução do stream são definidas no
# painel web da câmera (configure o stream principal em 1080p / 30fps).
# Se num PC fraco travar/cair o fps, baixe aqui para 1280.
largura_processamento = 1920

# Modelo de IA. yolov8n-pose = leve e RÁPIDO (menos delay no rastreio) — recomendado.
# yolov8s-pose = mais preciso porém mais pesado (pode dar delay em CPU).
modelo = yolov8n-pose.pt

# Resolução da DETECÇÃO (só a IA). MENOR = mais rápido/menos delay. 736 é um bom
# equilíbrio; use 960/1280 só se o PC for forte, ou 640 se quiser ainda mais rápido.
deteccao_largura = 736

# Confiança mínima da detecção (0-1). Maior = menos falso-positivo (menos "bug"
# com muita gente), porém pode perder gente distante. 0.35 é equilibrado.
deteccao_confianca = 0.35

# "Folga" no centro: enquanto a pessoa estiver dentro dessa margem, a câmera fica parada
# (evita ficar tremendo). Valor em fração da tela (0.06 = 6%).
zona_morta_x = 0.06
zona_morta_y = 0.06

# Sensibilidade do movimento (maior = reage mais rápido, porém mais nervoso)
ganho_pan = 12.0
ganho_tilt = 10.0

# Velocidade máxima enviada à câmera (pan 1-24, tilt 1-20). Equilíbrio entre alcançar
# rápido (menos delay) e não passar do ponto. 9/7 é responsivo e ainda estável.
vel_max_pan = 9
vel_max_tilt = 7

# VELOCIDADE DE SEGUIR (anti-fuga): multiplica a velocidade quando o pastor se
# aproxima da BORDA do quadro, pra ele não escapar pela lateral. No centro a câmera
# fica firme (multiplicador 1); na beirada chega neste valor. 1.0 = desliga o turbo;
# 2.0 é bom pra quem anda rápido; até ~2.8 se ainda estiver perdendo. Ajustável também
# pelo slider "Velocidade de seguir". O teto físico do hardware (24/20) é respeitado.
velocidade_seguir = 2.0

# Ponto de mira vertical DENTRO da pessoa (0 = topo da cabeça, 1 = pés).
# 0.30 mira na cabeça/ombros, que é o enquadramento bonito pra pregação.
mira_vertical = 0.30

# Onde a pessoa fica NA TELA (0 = topo, 1 = base). É isto que tira o "vão em cima":
#   posicao_tela_y = 0.38 deixa o rosto um pouco ACIMA do meio (menos espaço sobre a cabeça).
#   Diminua (ex: 0.32) para subir mais o rosto; aumente (ex: 0.50) para centralizar.
posicao_tela_y = 0.38
# Horizontal: 0.50 = centralizado. Use 0.40 ou 0.60 para deixar a pessoa mais para
# um lado (regra dos terços), deixando espaço na direção que ela olha.
posicao_tela_x = 0.50

# Zoom automático para manter a pessoa com uma altura fixa na tela.
# Deixe true para o app cuidar do zoom, ou false para você controlar o zoom na mão.
zoom_automatico = false
# Altura desejada da pessoa como fração da tela (0.7 = pessoa ocupa 70% da altura)
zoom_alvo_altura = 0.70

# Tempo (segundos) que a câmera espera parada quando perde totalmente o alvo,
# antes de considerar que perdeu de vez.
timeout_perda = 3.0

# Quando o rastreador troca o número da pessoa, o app re-gruda na mesma pessoa
# procurando a detecção mais próxima de onde o alvo estava. Este é o raio de busca,
# em fração da largura da tela. MENOR = mais rigoroso (não pega quem passa na
# frente). 0.12 é seguro; aumente só se ele perder o alvo fácil.
raio_reidentificacao = 0.12

# --- Suavidade do movimento (evita "câmera nervosa" e micro-movimentos) ---
# MARGEM DE SEGURANÇA: quanto a pessoa precisa sair do centro para a câmera
# COMEÇAR a mexer (fração da meia-tela). Maior = mais PARADA e estável (fica firme,
# só mexe quando a pessoa realmente anda). É ESTE o ajuste pra "não ficar mexendo".
margem_seguranca = 0.22
# MARGEM VERTICAL: o quanto a cabeça pode subir/descer sem a câmera inclinar.
# Maior = não corta a cabeça quando o pastor abaixa (pra ler) — a câmera ignora
# esse movimento vertical. Ajustável também pelo slider "Margem vertical".
margem_vertical = 0.32
# FIRMEZA VERTICAL: ignora de vez pequenos tremores de cima/baixo (respirar,
# balançar a cabeça ao falar) — o alvo interno nem se mexe para isso, é mais forte
# que a margem vertical. Se a câmera ainda estiver "corrigindo por pouca coisa" na
# vertical, aumente este valor (ou pelo slider "Firmeza vertical").
firmeza_vertical = 0.03
# A câmera PARA quando a pessoa volta para dentro desta margem menor (histerese:
# não fica ligando/desligando à toa).
parar_em = 0.05
# Suavização do alvo (0-1). MENOR = mais suave e estável, ignora tremor da
# detecção e braço abrindo. 0.15 é um bom começo.
suavizacao = 0.15
# Aceleração: quão rápido a velocidade muda. MENOR = arranque e parada mais
# macios (mais cinematográfico). 1.0 é suave.
aceleracao = 1.0

# ANTECIPAÇÃO: quando o alvo corre para um lado, a câmera "chumba" na frente e
# continua indo naquele lado. Ligar/desligar também pelo painel "Antecipação".
antecipar = false
# Quanto antecipar (quantos "passos" de velocidade à frente). Maior = chumba mais.
antecipar_ganho = 8.0

[presets]
# Atraso (segundos) para as CORES/exposição entrarem ao chamar um preset — dá tempo
# da câmera CHEGAR na posição antes de trocar a cor (senão troca no meio do caminho e
# fica feio). Ajustável também na tela de Configurações (menu PTZ). 2.0 é um bom começo.
delay_cores = 2.0
# Nomes dos presets (aparecem nos botões). O app salva/atualiza aqui.
nome_1 = Púlpito
nome_2 = Ministro
nome_3 = Palco aberto
nome_4 = Bateria
nome_5 = Baixo
nome_6 = Guitarra
nome_7 = Teclado
nome_8 = Plateia
nome_9 = Geral

[gamepad]
# Controle de PS4 / Xbox. Deixe true para ativar (precisa do controle conectado).
ativar = true
# Zona morta dos analógicos (ignora movimento pequeno do dedão). 0.15 = 15%.
zona_morta = 0.15
# Eixos: esquerdo = pan/tilt ; direito = zoom (Y) e foco (X).
eixo_pan = 0
eixo_tilt = 1
eixo_foco = 2
eixo_zoom = 3
# Botões (ajuste se o seu controle numerar diferente):
# X=preset1  O=preset2  quadrado=preset3  triangulo=preset4
btn_preset1 = 0
btn_preset2 = 1
btn_preset3 = 2
btn_preset4 = 3
# L1=cancela seguir  R1=para de seguir  L2=segue central  R2=volta a seguir
btn_l1 = 4
btn_r1 = 5
btn_l2 = 6
btn_r2 = 7
# Setas (d-pad) salvam presets: baixo=1, direita=2, esquerda=3, cima=4

[osd]
# Menu INTERNO da câmera (aparece sobre o vídeo, igual ao do controle físico).
# Comandos VISCA em hex (bytes separados por espaço). Estes são os padrões mais
# comuns em PTZOptics/NeoiD; se algum não funcionar na sua, me avise que ajusto.
# Abrir/fechar o menu:
menu = 81 01 06 06 10 FF
# Confirmar (Enter/OK) e Voltar — em muitas câmeras é a seta direita/esquerda,
# mas se a sua tiver comando próprio, coloque aqui:
ok = 81 01 06 06 05 FF
voltar = 81 01 06 06 04 FF
# Velocidade das setas ao navegar o menu (1-24)
vel_seta = 6

[cores]
# Valores iniciais (0-100). O app também ajusta ao vivo pelos sliders.
saturacao = 50
contraste = 50
brilho = 50
matiz = 50
nitidez = 50
# Balanço de branco na ABERTURA do app:
#   none    = NÃO mexe (mantém o que está configurado no menu da câmera) <-- recomendado
#   auto / indoor / outdoor / manual / var
# "var" = temperatura de cor fixa (VAR). Deixe "none" para preservar o VAR do menu.
white_balance = none
# Código VISCA do modo VAR/Temperatura de cor da sua câmera (padrão 32 = 0x20).
# Se ao escolher "VAR" no app ela não entrar em VAR, ajuste este número.
wb_var_codigo = 32

